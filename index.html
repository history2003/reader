<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Novel Reader</title>
  
  <!-- Мета-теги для работы в режиме приложения на телефоне -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#18181b">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            sepiaBg: '#fbf0d9',
            sepiaText: '#5f4b32',
            sepiaCard: '#f4e2be',
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.3); border-radius: 4px; }
    .sepia { background-color: #fbf0d9 !important; color: #5f4b32 !important; }
    .reader-text { line-height: 1.8; text-align: justify; }
  </style>
</head>
<body id="bodyRoot" class="bg-zinc-900 text-zinc-100 min-h-screen flex flex-col font-sans transition-colors duration-200 select-none md:select-auto">

  <!-- Шапка сайта -->
  <header class="sticky top-0 z-30 px-3 py-2.5 border-b border-zinc-800 backdrop-blur-md bg-zinc-900/90 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-xl">📖</span>
      <h1 class="font-bold text-sm md:text-lg tracking-tight">Novel Reader</h1>
    </div>

    <!-- Управление -->
    <div class="flex items-center gap-1.5">
      <div class="flex bg-zinc-800 p-0.5 rounded-lg border border-zinc-700 text-xs">
        <button onclick="setTheme('light')" class="px-1.5 py-0.5 rounded">☀️</button>
        <button onclick="setTheme('sepia')" class="px-1.5 py-0.5 rounded">📜</button>
        <button onclick="setTheme('dark')" class="px-1.5 py-0.5 rounded">🌙</button>
      </div>

      <div class="flex bg-zinc-800 p-0.5 rounded-lg border border-zinc-700 text-xs font-semibold">
        <button onclick="changeFontSize(-2)" class="px-1.5 py-0.5 rounded">A-</button>
        <button onclick="changeFontSize(2)" class="px-1.5 py-0.5 rounded">A+</button>
      </div>

      <button onclick="toggleSettingsModal()" class="p-1.5 rounded-lg bg-zinc-800 border border-zinc-700 text-xs">
        ⚙️
      </button>
    </div>
  </header>

  <!-- Мобильные вкладки -->
  <div class="flex md:hidden border-b border-zinc-800 bg-zinc-950/60 text-xs font-medium sticky top-[49px] z-20">
    <button id="tabInputBtn" onclick="switchTab('input')" class="flex-1 py-2 text-center border-b-2 border-amber-500 text-amber-500">
      Оригинал (EN)
    </button>
    <button id="tabReadBtn" onclick="switchTab('read')" class="flex-1 py-2 text-center border-b-2 border-transparent opacity-60">
      Чтение (RU)
    </button>
  </div>

  <!-- Главный контейнер -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 md:p-6 grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-6">
    
    <!-- Ввод оригинала -->
    <section id="panelInput" class="flex flex-col gap-2">
      <div class="flex items-center justify-between text-xs opacity-70">
        <span>Вставьте текст главы (EN):</span>
        <button onclick="document.getElementById('inputText').value=''" class="text-red-400">Очистить</button>
      </div>
      <textarea 
        id="inputText" 
        placeholder="Paste novel text here..."
        class="w-full flex-1 min-h-[380px] md:min-h-[550px] p-3 rounded-xl bg-zinc-800/40 border border-zinc-700/60 focus:outline-none focus:ring-1 focus:ring-amber-500 text-sm leading-relaxed"
      ></textarea>

      <button 
        id="translateBtn"
        onclick="handleTranslate()" 
        class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-semibold rounded-xl flex items-center justify-center gap-2 shadow-lg active:scale-[0.98] transition-all text-sm"
      >
        <span>✨ Перевести на русский</span>
      </button>
    </section>

    <!-- Читалка (RU) -->
    <section id="panelRead" class="hidden md:flex flex-col gap-2">
      <div class="flex items-center justify-between text-xs opacity-70">
        <span>Перевод главы:</span>
        <button onclick="copyTranslation()" id="copyBtn" class="hover:underline">📋 Скопировать</button>
      </div>

      <div class="w-full flex-1 min-h-[380px] md:min-h-[550px] p-4 md:p-6 rounded-xl bg-zinc-800/20 border border-zinc-700/50 overflow-y-auto">
        <div id="outputText" class="reader-text font-serif text-base leading-relaxed select-text">
          <div class="h-full flex flex-col items-center justify-center text-center opacity-40 py-20">
            <span class="text-4xl mb-2">📖</span>
            <p class="text-xs">Здесь появится очищенный и переведенный текст главы</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Окно настроек -->
  <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-zinc-900 border border-zinc-700 p-5 rounded-2xl max-w-sm w-full space-y-3 shadow-2xl">
      <h3 class="font-bold text-base">Настройки API</h3>
      <p class="text-xs text-zinc-400">
        Ключ сохраняется только в браузере вашего телефона.
      </p>

      <div class="space-y-1">
        <label class="text-xs text-zinc-300">Провайдер:</label>
        <select id="providerSelect" class="w-full p-2 rounded-lg bg-zinc-800 border border-zinc-700 text-xs">
          <option value="gemini">Google Gemini (Gemini 2.0 Flash)</option>
          <option value="openrouter">OpenRouter (DeepSeek Chat)</option>
        </select>
      </div>

      <div class="space-y-1">
        <label class="text-xs text-zinc-300">API-ключ:</label>
        <input 
          type="password" 
          id="apiKeyInput" 
          placeholder="AIzaSy... или sk-or-..." 
          class="w-full p-2 rounded-lg bg-zinc-800 border border-zinc-700 text-xs focus:outline-none focus:ring-1 focus:ring-amber-500"
        />
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="toggleSettingsModal()" class="px-3 py-1.5 rounded-lg bg-zinc-800 text-xs">Закрыть</button>
        <button onclick="saveSettings()" class="px-3 py-1.5 rounded-lg bg-amber-600 text-xs font-semibold text-white">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    let currentTheme = localStorage.getItem('novel_theme') || 'dark';
    let currentFontSize = parseInt(localStorage.getItem('novel_font_size') || '16');
    let apiKey = localStorage.getItem('novel_api_key') || '';
    let provider = localStorage.getItem('novel_provider') || 'gemini';

    document.getElementById('apiKeyInput').value = apiKey;
    document.getElementById('providerSelect').value = provider;
    applyTheme(currentTheme);
    applyFontSize(currentFontSize);

    function toggleSettingsModal() {
      const modal = document.getElementById('settingsModal');
      modal.classList.toggle('hidden');
      modal.classList.toggle('flex');
    }

    function saveSettings() {
      apiKey = document.getElementById('apiKeyInput').value.trim();
      provider = document.getElementById('providerSelect').value;
      localStorage.setItem('novel_api_key', apiKey);
      localStorage.setItem('novel_provider', provider);
      toggleSettingsModal();
    }

    function setTheme(theme) {
      currentTheme = theme;
      localStorage.setItem('novel_theme', theme);
      applyTheme(theme);
    }

    function applyTheme(theme) {
      const root = document.getElementById('bodyRoot');
      root.classList.remove('sepia', 'bg-white', 'text-zinc-900', 'bg-zinc-900', 'text-zinc-100');
      if (theme === 'light') {
        root.classList.add('bg-white', 'text-zinc-900');
      } else if (theme === 'sepia') {
        root.classList.add('sepia');
      } else {
        root.classList.add('bg-zinc-900', 'text-zinc-100');
      }
    }

    function changeFontSize(delta) {
      currentFontSize = Math.min(26, Math.max(13, currentFontSize + delta));
      localStorage.setItem('novel_font_size', currentFontSize);
      applyFontSize(currentFontSize);
    }

    function applyFontSize(size) {
      document.getElementById('outputText').style.fontSize = size + 'px';
    }

    function switchTab(tab) {
      const panelInput = document.getElementById('panelInput');
      const panelRead = document.getElementById('panelRead');
      const tabInputBtn = document.getElementById('tabInputBtn');
      const tabReadBtn = document.getElementById('tabReadBtn');

      if (tab === 'input') {
        panelInput.classList.remove('hidden');
        panelRead.classList.add('hidden');
        tabInputBtn.className = "flex-1 py-2 text-center border-b-2 border-amber-500 text-amber-500 font-medium";
        tabReadBtn.className = "flex-1 py-2 text-center border-b-2 border-transparent opacity-60 font-medium";
      } else {
        panelInput.classList.add('hidden');
        panelRead.classList.remove('hidden');
        panelRead.classList.add('flex');
        tabReadBtn.className = "flex-1 py-2 text-center border-b-2 border-amber-500 text-amber-500 font-medium";
        tabInputBtn.className = "flex-1 py-2 text-center border-b-2 border-transparent opacity-60 font-medium";
      }
    }

    function copyTranslation() {
      const text = document.getElementById('outputText').innerText;
      if (!text) return;
      navigator.clipboard.writeText(text);
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = "✅ Готово";
      setTimeout(() => copyBtn.innerText = "📋 Скопировать", 2000);
    }

    function cleanRawText(raw) {
      return raw
        .replace(/Discover more stories at [^\n]+/gi, '')
        .replace(/Read more at [^\n]+/gi, '')
        .replace(/freewebnovel(\.com)?/gi, '')
        .replace(/novelbin(\.com)?/gi, '')
        .replace(/lightnovelpub(\.com)?/gi, '')
        .replace(/Wuxiaworld/gi, '')
        .trim();
    }

    async function handleTranslate() {
      const rawText = document.getElementById('inputText').value.trim();
      if (!rawText) return alert('Вставьте текст главы');
      if (!apiKey) {
        toggleSettingsModal();
        return alert('Укажите ваш API-ключ');
      }

      const translateBtn = document.getElementById('translateBtn');
      const outputDiv = document.getElementById('outputText');
      
      translateBtn.disabled = true;
      translateBtn.innerText = "⏳ Перевожу главу...";
      outputDiv.innerHTML = '<p class="opacity-50 animate-pulse text-center py-10">Идет литературный перевод...</p>';

      if (window.innerWidth < 768) {
        switchTab('read');
      }

      const cleanedText = cleanRawText(rawText);
      const systemPrompt = `Ты — литературный переводчик веб-новелл (Wuxia, Xianxia, LitRPG). Переведи английский текст главы на красивый, естественный русский язык:
1. Живой слог в стиле ранобэ.
2. Диалоги оформляй длинным тире («— »).
3. Имена передавай благозвучно (Lin Shen -> Линь Шэнь).
4. Вырезай рекламные вставки сайтов и водяные знаки.
5. Выводи ТОЛЬКО перевод главы, без комментариев.`;

      try {
        let translatedResult = "";

        if (provider === 'gemini') {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{ text: `${systemPrompt}\n\nТекст:\n${cleanedText}` }]
              }]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          translatedResult = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!translatedResult) throw new Error('Пустой ответ от модели');
        } else {
          const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${apiKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: 'deepseek/deepseek-chat',
              messages: [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: cleanedText }
              ]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          translatedResult = data.choices?.[0]?.message?.content;
        }

        const paragraphs = translatedResult.split('\n').filter(p => p.trim() !== '');
        outputDiv.innerHTML = paragraphs.map(p => `<p class="mb-3">${p}</p>`).join('');

      } catch (err) {
        outputDiv.innerHTML = `<p class="text-red-400 py-4">Ошибка: ${err.message}</p>`;
      } finally {
        translateBtn.disabled = false;
        translateBtn.innerText = "✨ Перевести на русский";
      }
    }
  </script>
</body>
</html>
